services:  
  postgres:
    image: postgres:latest
    container_name: riese-boost-postgres
    restart: always
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - rieseboost-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_USER: '${POSTGRES_USER}'
  pgadmin:
    image: dpage/pgadmin4:latest
    volumes:
      - rieseboost-admin:/var/lib/pgadmin/data
    environment:
      PGADMIN_DEFAULT_EMAIL: 'pgadmin4@pgadmin.org'
      PGADMIN_DEFAULT_PASSWORD: 'admin'
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  rieseboost-data:
  rieseboost-admin:

networks:
  rieseboost-network:
    external: true
    driver: bridge