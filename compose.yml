services:
  web:
    build: .
    container_name: riese-boost
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
    command: npm run dev
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:6.2.10
    container_name: riese-boost-redis
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
  postgres:
    image: postgres
    container_name: riese-boost-postgres
    restart: always
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_USER: '${POSTGRES_USER}'